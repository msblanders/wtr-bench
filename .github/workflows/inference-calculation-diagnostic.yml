name: Inference calculation diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inference-calculation-diagnostic
  cancel-in-progress: false

jobs:
  calculation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups --extra eval
      - name: Verify calculation request and scoring offline
        run: uv run --frozen pytest -q tests/test_calculation_diagnostic.py
      - name: Check API credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get("ANTHROPIC_API_KEY"):
              raise SystemExit("ANTHROPIC_API_KEY repository secret is required.")
          PY
      - name: Save prompts and provenance
        run: |
          uv run --frozen python -m wtrbench.calculation_diagnostic generate
          git rev-parse HEAD > runs/calculation-diagnostic/git-revision.txt
          uv pip freeze > runs/calculation-diagnostic/dependencies.txt
      - name: Run 24 explicit-rule calculation controls
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run --frozen python -m wtrbench.calculation_diagnostic run
      - name: Inspect complete or partial responses
        if: always()
        run: |
          response="runs/calculation-diagnostic/responses.jsonl"
          if [ -f "$response" ]; then
            uv run --frozen python -m wtrbench.calculation_diagnostic inspect "$response" > runs/calculation-diagnostic/responses.inspect.md
            cat runs/calculation-diagnostic/responses.inspect.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save calculation diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inference-calculation-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/calculation-diagnostic/
          retention-days: 90
          if-no-files-found: ignore
