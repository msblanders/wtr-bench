name: scientific-confidence-v5
on:
  push:
    branches: [run/scientific-confidence-v5-20261030]
permissions:
  contents: read
concurrency:
  group: scientific-confidence-v5
  cancel-in-progress: false
jobs:
  development:
    if: github.event.head_commit.message == 'Run scientific-confidence-v5 verified-start test once'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate numerical and collection boundaries
        run: python -m unittest discover -s tests -p 'test_scientific_confidence*.py' -v
      - name: Freeze all development and main cases
        run: python experiments/scientific-confidence-v5/experiment.py generate --out runs/scientific-confidence-v5
      - name: Run development transport check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.WTR_BENCH || secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo 'Refusing repeated paid collection.'
            exit 1
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo 'Configured API secret is unavailable.'
            exit 1
          fi
          python runs/scientific-confidence-v5/experiment.py collect --out runs/scientific-confidence-v5 --phase development --budget-usd 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-confidence-v5-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/scientific-confidence-v5/
          retention-days: 90
  evaluation:
    needs: development
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: scientific-confidence-v5-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/scientific-confidence-v5/
      - name: Evaluate frozen main cases with shared spending guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.WTR_BENCH || secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo 'Refusing repeated paid collection.'
            exit 1
          fi
          python runs/scientific-confidence-v5/experiment.py collect --out runs/scientific-confidence-v5 --phase main --budget-usd 80
      - name: Score available outputs
        if: always()
        run: |
          if [ -f runs/scientific-confidence-v5/manifest.json ]; then
            python runs/scientific-confidence-v5/experiment.py report --out runs/scientific-confidence-v5
            cat runs/scientific-confidence-v5/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-confidence-v5-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/scientific-confidence-v5/
          retention-days: 90

