name: Inference debug (explanation)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inference-debug-explanation
  cancel-in-progress: false

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups --extra eval
      - name: Verify explanation request and scoring offline
        run: uv run --frozen pytest -q tests/test_explanation_debug.py
      - name: Verify synthetic recovery
        run: uv run --frozen python -m wtrbench.pilot synthetic
      - name: Check API credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get("ANTHROPIC_API_KEY"):
              raise SystemExit("ANTHROPIC_API_KEY repository secret is required.")
          PY
      - name: Save prompts and provenance
        run: |
          uv run --frozen python -m wtrbench.explanation_debug generate
          git rev-parse HEAD > runs/debug-explanation/git-revision.txt
          uv pip freeze > runs/debug-explanation/dependencies.txt
      - name: Run 24 controls then 196 exploratory debug questions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run --frozen python -m wtrbench.explanation_debug run
      - name: Inspect complete or partial responses
        if: always()
        run: |
          response="runs/debug-explanation/responses.jsonl"
          if [ -f "$response" ]; then
            uv run --frozen python -m wtrbench.explanation_debug inspect "$response" > runs/debug-explanation/responses.inspect.md
            cat runs/debug-explanation/responses.inspect.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save explanation debug artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inference-debug-explanation-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/debug-explanation/
          retention-days: 90
          if-no-files-found: ignore
