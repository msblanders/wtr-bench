name: Paired social pilot v1
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Generate offline files or collect the one 144-request social pilot
        type: choice
        options: [generate, collect]
        default: generate
      confirmation:
        description: For paid collection only, type COLLECT_144 after reviewing the pilot plan
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: paired-pilot-v1
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-groups --extra eval
      - name: Check frozen source and pilot software tests (no model calls)
        run: |
          uv run python -m wtrbench.paired.social check
          uv run pytest tests/test_paired_social_pilot.py
      - name: Generate frozen pilot and source snapshot (no model calls)
        run: |
          uv run python -m wtrbench.paired.social generate
          uv pip freeze > runs/paired-pilot-v1/environment.txt
      - name: Collect only with explicit confirmation
        if: inputs.mode == 'collect'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test "$CONFIRMATION" = COLLECT_144 || { echo 'Missing COLLECT_144'; exit 1; }
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo 'Do not Re-run jobs'; exit 1; }
          test -n "$ANTHROPIC_API_KEY" || { echo 'Missing ANTHROPIC_API_KEY secret'; exit 1; }
          uv run python -m wtrbench.paired.social run --confirm 144
      - name: Report complete or partial records offline
        if: always()
        run: |
          if test -f runs/paired-pilot-v1/responses.jsonl; then
            uv run python -m wtrbench.paired.social report
          fi
      - name: Checksum all artifacts
        if: always()
        run: |
          if test -d runs/paired-pilot-v1; then
            (cd runs/paired-pilot-v1 && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-pilot-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/paired-pilot-v1/
          if-no-files-found: warn
