name: Costly action and indirect beneficiary pilot
on:
  push:
    branches: [experiment/indirect-benefit-v1]
    paths: [.github/workflows/indirect-benefit-v1.yml]
permissions:
  contents: read
concurrency:
  group: indirect-benefit-v1
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.before == '8b2d920952e581a3e92ffcedacde2e7e0e1a415d' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: experiments/indirect-benefit-v1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the frozen files and run offline tests
        run: |
          sha256sum -c SHA256SUMS
          python3 study.py check
          python3 -m unittest -v test_study
      - name: Collect the 96 fixed prompts under the one-dollar guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.WTR_BENCH || secrets.ANTHROPIC_API_KEY }}
        run: python3 study.py collect
      - name: Score all available responses
        if: always() && hashFiles('experiments/indirect-benefit-v1/run/records.sqlite3') != ''
        run: python3 study.py report
      - name: Preserve the response ledger and scores
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('experiments/indirect-benefit-v1/run/records.sqlite3') != ''
        with:
          name: indirect-benefit-results-${{ github.run_id }}
          path: |
            experiments/indirect-benefit-v1/run/records.sqlite3
            experiments/indirect-benefit-v1/run/report.json
            experiments/indirect-benefit-v1/run/requests.jsonl
          retention-days: 90
