name: scientific-confidence-v4-offline-audit
on:
  push:
    branches: [audit/scientific-confidence-v4-20261030]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.event.head_commit.message == 'Audit scientific-confidence-v4 records offline'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: scientific-confidence-v4-41009350913-1
          run-id: 41009350913
          github-token: ${{ github.token }}
          path: source-run
      - name: Audit records without model calls
        run: |
          python - <<'PY'
          import hashlib, json, statistics
          from pathlib import Path
          root = Path("source-run")
          manifest = json.loads((root / "manifest.json").read_text())
          for name, expected in manifest["files"].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          calls = [json.loads(x) for x in (root / "calls.jsonl").read_text().splitlines()]
          records = [json.loads(x) for x in (root / "records.jsonl").read_text().splitlines()]
          scores = json.loads((root / "scores.json").read_text())
          trajectories = json.loads((root / "trajectory_means.json").read_text())
          assert len({(c["case_id"], c["arm"], c["stage"]) for c in calls}) == len(calls)
          assert len({(r["case_id"], r["kind"], r["step"]) for r in records}) == len(records)
          arms = {}
          for arm in manifest["arms"]:
              recs = [r for r in records if r["case_id"].startswith("TEST") and r["kind"] == arm]
              rows = [r for r in scores if r["phase"] == "main" and r["arm"] == arm]
              part = [r for r in trajectories if r["phase"] == "main" and r["arm"] == arm]
              sizes = [len(r.get("data", {}).get("entries", [])) for r in recs]
              word_counts = [len(r.get("data", {}).get("evidence_basis", "").split()) for r in recs]
              arms[arm] = {
                  "records": len(recs),
                  "records_containing_inactive_rows": sum(any(x.get("status") != "active" for x in r.get("data", {}).get("entries", [])) for r in recs),
                  "mean_retained_rows": statistics.mean(sizes),
                  "max_retained_rows": max(sizes),
                  "notes_over_120_words": sum(n > 120 for n in word_counts),
                  "max_note_words": max(word_counts),
                  "valid_checkpoints_with_diagnostic_error": sum(r["valid"] and "error" in r for r in rows),
                  "unfaithful_but_within_half_percentage_point": sum(not r["active_source_faithful"] and r.get("max_probability_error", 2) <= .005 for r in rows),
                  "trajectories_with_mean_loss_above_1e_8": sum(r["mean_loss"] > 1e-8 for r in part),
              }
          idx = {(r["case_id"], r["arm"]): r for r in trajectories if r["phase"] == "main"}
          ids = sorted({cid for cid, arm in idx})
          deltas = [idx[cid, "versioned_operator"]["mean_loss"] - idx[cid, "active_checklist"]["mean_loss"] for cid in ids]
          result = {
              "frozen_file_hashes_verified": True,
              "unique_call_and_record_keys_verified": True,
              "calls": len(calls), "planned_calls": manifest["planned_calls"],
              "no_model_calls_in_audit": True, "arms": arms,
              "primary_case_directions_descriptive": {
                  "operator_better_by_more_than_1e_8": sum(d < -1e-8 for d in deltas),
                  "baseline_better_by_more_than_1e_8": sum(d > 1e-8 for d in deltas),
                  "negligible_difference": sum(abs(d) <= 1e-8 for d in deltas),
                  "largest_absolute_delta_share": max(map(abs, deltas)) / sum(map(abs, deltas)) if sum(map(abs, deltas)) else 0,
              }
          }
          out = Path("audit-results")
          out.mkdir(exist_ok=True)
          (out / "audit.json").write_text(json.dumps(result, indent=2) + "\n")
          print("V4_AUDIT_JSON " + json.dumps(result, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scientific-confidence-v4-offline-audit-${{ github.run_id }}
          path: audit-results/
          retention-days: 90
