name: checkpoint-selection-v1

on:
  push:
    branches: [experiment/checkpoint-selection-v1, run/checkpoint-selection-v1-20261030]
  pull_request:
    paths:
      - experiments/checkpoint-selection-v1/**
      - .github/workflows/checkpoint-selection-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint-selection-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: experiments/checkpoint-selection-v1/requirements.txt
      - run: python -m pip install -r experiments/checkpoint-selection-v1/requirements.txt
      - name: Fetch and verify independent source
        run: python experiments/checkpoint-selection-v1/external.py upstream
      - name: Validate trajectory equivalence and checkpoint-policy invariants
        env:
          DISCOVERY_UPSTREAM: upstream
        run: python experiments/checkpoint-selection-v1/test_integrity.py
      - name: Freeze source, protocol and independent implementation
        run: python experiments/checkpoint-selection-v1/experiment.py freeze --upstream upstream --out frozen
      - uses: actions/upload-artifact@v4
        with:
          name: checkpoint-selection-protocol-${{ github.run_id }}
          path: frozen/

  select:
    needs: validate
    if: github.event.head_commit.message == 'Run checkpoint-selection-v1 pilot once'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: checkpoint-selection-protocol-${{ github.run_id }}
          path: frozen
      - run: python -m pip install -r frozen/requirements.txt
      - name: Run paired policies on the same fresh trajectories
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo 'Inspect existing artifacts before launching a new experiment.'
            exit 1
          fi
          python frozen/experiment.py run --seed ${{ matrix.seed }} --out runs/seed-${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-selection-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: runs/seed-${{ matrix.seed }}/
          if-no-files-found: warn

  aggregate:
    needs: [validate, select]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: checkpoint-selection-protocol-${{ github.run_id }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: checkpoint-selection-seed-*-${{ github.run_id }}
          path: collected
      - run: python -m pip install -r frozen/requirements.txt
      - name: Analyze all eight independent runs
        run: python frozen/experiment.py aggregate --inputs collected --out final
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-selection-results-${{ github.run_id }}
          path: final/
          if-no-files-found: warn

